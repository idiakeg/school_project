<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>School App</title>
	</head>
	<body>
		<header>
			<section class="banner"></section>
			<section class="teacher_or_student">
				<button>teacher</button>
				<button>student</button>
			</section>
		</header>
		<section>
			<div class="teacher_form_container container">
				<form>
					<div class="form_group">
						<label for="fname">First Name</label>
						<input type="text" id="fname" name="first_name" required />
					</div>

					<div class="form_group">
						<label for="lname">Last Name</label>
						<input type="text" id="lname" name="last_name" required />
					</div>

					<div class="form_group">
						<label for="lname">Last Name</label>
						<input type="text" id="lname" name="last_name" required />
					</div>

					<div class="form_group">
						<label for="national_id">Contact</label>
						<input type="number" id="national_id" name="national_id" required />
					</div>

					<div class="form_group">
						<label for="dob">DOB</label>
						<input type="date" id="dob" name="date_of_birth" required />
					</div>

					<div class="form_group">
						<label for="career">Career</label>
						<input type="text" id="career" name="career" required />
					</div>

					<div class="form_group span_all">
						<label for="reason_career">Reason for Career</label>
						<textarea name="reason_for_career" id="reason_career"></textarea>
					</div>

					<button class="span_all form_btn">Submit</button>
				</form>
			</div>
		</section>
	</body>
</html>
